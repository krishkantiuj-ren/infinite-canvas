server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep DDShub requests same-origin so browser CORS checks do not block them.
    location /ddshub/v1/ {
        proxy_pass https://www.ddshub.cc/v1/;
        proxy_ssl_server_name on;
        proxy_ssl_name www.ddshub.cc;
        proxy_set_header Host www.ddshub.cc;
        proxy_set_header Authorization $http_authorization;

        client_max_body_size 100m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
